name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hourly, off the top of the hour. Pages allows about 10 builds an hour.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt
      - name: Pipeline tests
        run: python -m pytest
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Web tests
        run: npm test
        working-directory: web

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      fetch_outcome: ${{ steps.fetch.outcome }}
      cams_outcome: ${{ steps.cams.outcome }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5

      - run: pip install -r pipeline/requirements.txt

      # History lives on the live site, not in git: copy the last 72 hours back in first.
      - name: Pull history from the live site
        continue-on-error: true
        run: python -m pipeline.history pull --base-url "${{ steps.pages.outputs.base_url }}/data" --out web/public/data

      - name: Fetch latest OpenAQ PM2.5 and NO2
        id: fetch
        continue-on-error: true
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m pipeline.build_stations --out web/public/data --history

      - name: Keep the last good frame
        if: steps.fetch.outcome == 'failure'
        run: >
          python -m pipeline.fallback
          --base-url "${{ steps.pages.outputs.base_url }}/data"
          --out web/public/data
          --required stations-pm25.json
          -- stations-pm25.json stations-pm25-index.json stations-no2.json stations-no2-index.json

      # Calls the ADS only when a newer CAMS run is due (twice a day); otherwise keeps frames.
      - name: CAMS PM2.5 forecast
        id: cams
        continue-on-error: true
        timeout-minutes: 25
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: python -m pipeline.cams --out web/public/data --timeout-min 20

      # Wind changes every 6 hours; the frame pulled from the live site stays if this fails.
      - name: GFS 10 m wind
        id: wind
        continue-on-error: true
        timeout-minutes: 5
        run: python -m pipeline.gfs --out web/public/data

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The site keeps the last good frame, but a failed fetch should still turn the run red.
  report:
    needs: [build, deploy]
    if: needs.build.outputs.fetch_outcome == 'failure' || needs.build.outputs.cams_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::A data fetch failed (OpenAQ: ${{ needs.build.outputs.fetch_outcome }}, CAMS: ${{ needs.build.outputs.cams_outcome }}). The site keeps the last good frames."
          exit 1
